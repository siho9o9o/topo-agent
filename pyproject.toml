[project]
name = "topo-agent"
version = "0.1.0"
description = "Mirai Climbing topo agent (finds holds of the same boulder problem from a photo)"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
dependencies = ["pillow", "httpx", "meta-sam-parser==0.1.0"]

[project.optional-dependencies]
gemini = ["google-genai"]

[tool.setuptools]
packages = ["topo_agent", "topo_agent.baseline"]
